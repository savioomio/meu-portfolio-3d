name: CI - Build

# O deploy de producao agora e feito por WEBHOOK no servidor caseiro
# (celular Termux + Cloudflare Tunnel). Ver deploy/README.md.
# Este workflow apenas VALIDA que o projeto compila a cada push/PR.
# O push na main dispara o webhook do GitHub que atualiza o celular.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build de validacao
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Conferir que o dist foi gerado
        run: test -f dist/index.html && echo "Build OK"
